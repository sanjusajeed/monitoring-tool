server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed Vite bundles; Vite guarantees unique filenames per build.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — any path that isn't a file → index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # /api/* is never served from here; Istio VirtualService routes it to the
    # backend Service before it reaches this Pod. Explicit 404 if anything ever
    # leaks through, so it's obvious in logs instead of returning index.html.
    location /api/ {
        return 404;
    }
}
